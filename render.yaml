services:
  - type: web
    name: intellidocs-backend
    env: python
    buildCommand: apt-get update && apt-get install -y tesseract-ocr espeak-ng && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PERSISTENT_DATA_DIR
        value: /var/data
    disk:
      name: intellidocs-data
      mountPath: /var/data
      sizeGB: 1
